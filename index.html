<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hessah Alazzaz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Gochi+Hand&family=Kalam:wght@300;400;700&family=Baloo+Bhaijaan+2:wght@400;500;700;800&display=swap">
<style>
/* Layout: a sketchbook portfolio — hanging press badge, hand-drawn frames with sticky notes, a toy camera gallery, and a yellow notebook that opens for contact. */
:root{
  --paper:#F6F5F1;
  --ink:#141414;
  --ink-soft:#4a4a4a;
  --note:#FFE600;
  --strap:#E0151B;
  --line:rgba(20,20,20,.16);
  --cam:#CFC8BC;
  --f-mark:"Permanent Marker", "Marker Felt", cursive;
  --f-hand:"Gochi Hand", "Comic Sans MS", cursive;
  --f-body:"Kalam", "Comic Sans MS", cursive;
  color-scheme:light;
}
/* in Arabic mode the Latin-only English faces come first, so any English word keeps its English font and Arabic letters fall through to Baloo */
:lang(ar){--f-mark:"Permanent Marker","Baloo Bhaijaan 2",sans-serif;--f-hand:"Gochi Hand","Baloo Bhaijaan 2",sans-serif;--f-body:"Kalam","Baloo Bhaijaan 2",sans-serif;font-synthesis:none}
:lang(ar) .slide .cap{display:none}
#imName{display:none}
:lang(en) .lang{font-family:"Baloo Bhaijaan 2",sans-serif;font-weight:800;font-size:16px}
/* Arabic uses Baloo Bhaijaan 2: extra-bold headings, medium notes and labels, regular running text */
:lang(ar) .logo span,:lang(ar) .pill,:lang(ar) .hero h1,:lang(ar) .cam-sec h2,:lang(ar) .cover .front h2,:lang(ar) .visit,:lang(ar) .lang{font-weight:800;letter-spacing:0}
:lang(ar) .note,:lang(ar) .tag,:lang(ar) .scribble,:lang(ar) .hint,:lang(ar) .page h3,:lang(ar) .send,:lang(ar) .links,:lang(ar) .cover .back span,:lang(ar) .playbtn,:lang(ar) .slide .cap,:lang(ar) .sec-label{font-weight:500}
:lang(ar) .hero .sub,:lang(ar) .desc,:lang(ar) .field input,:lang(ar) .field textarea{font-weight:400}
html{overflow-x:clip;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);overflow-x:clip;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
img{display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--strap);outline-offset:3px}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--paper)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:16px 12px;
  background:linear-gradient(var(--paper) 70%,rgba(246,245,241,0))}
.logo{display:inline-flex;align-items:center;gap:8px;padding:4px 14px 4px 8px;background:#fff;border:2.5px solid var(--ink);border-radius:9px;
  box-shadow:3px 3px 0 var(--ink);transform:rotate(-2deg);text-decoration:none;color:var(--ink)}
.logo img{width:40px;height:34px;object-fit:contain}
.logo span{font:400 22px/1 var(--f-mark);letter-spacing:.04em}
.top-r{display:flex;align-items:center;gap:14px}
nav.pills{display:flex;gap:22px;flex-wrap:wrap;justify-content:flex-end}
.pill{position:relative;padding:6px 16px;font:400 17px/1 var(--f-mark);text-decoration:none;color:var(--ink);background:none;border:0;cursor:pointer}
.pill svg{position:absolute;inset:-6px -9px;width:calc(100% + 18px);height:calc(100% + 12px);overflow:visible;pointer-events:none}
.pill svg path{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.pill:hover svg path{stroke-width:2.6}
.lang{font:400 15px/1 var(--f-mark);background:var(--note);border:2px solid var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer;transform:rotate(3deg)}

/* hero */
.hero{position:relative;min-height:calc(100svh - 70px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-block:0 32px;margin-top:-70px;box-sizing:border-box}
.bigword{position:absolute;top:26%;left:50%;transform:translateX(-50%);white-space:nowrap;pointer-events:none;
  font:400 clamp(60px,18vw,300px)/1 var(--f-mark);color:var(--note);opacity:.55;z-index:0}
.lanyard{position:relative;z-index:5;width:100%;height:clamp(460px,calc(100svh - 300px),680px);touch-action:none}
.swing{position:absolute;left:50%;top:0;width:0;height:0;transform-origin:0 0;will-change:transform}
.strap{position:absolute;left:-11px;top:-40px;width:22px;background:linear-gradient(90deg,#b80d12,var(--strap) 30%,var(--strap) 70%,#b80d12)}
.clasp{position:absolute;left:-30px;width:60px;height:150px;z-index:3;filter:drop-shadow(0 2px 2px rgba(0,0,0,.22))}
.strap{background:linear-gradient(90deg,#e4141a,#ef1c22 75%,#b80d12)!important}
.clasp svg{width:100%;height:100%}
.card{position:absolute;left:calc(var(--cw) / -2);width:var(--cw);aspect-ratio:476/616;background:linear-gradient(160deg,#fff,#ecebe7);border-radius:10px;
  box-shadow:0 30px 50px -20px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.06);cursor:grab;user-select:none;-webkit-user-select:none}
.card:active{cursor:grabbing}
.card .slot{position:absolute;top:14px;left:50%;width:30%;height:16px;transform:translateX(-50%);border-radius:9px;background:#fbfbfa;border:1px solid #c9c7c2;box-shadow:inset 0 1px 2px rgba(0,0,0,.12)}
.card{z-index:1}
.card .photo{position:absolute;left:7%;right:7%;top:12%;bottom:7%;background:#e9e6df;overflow:hidden;border-radius:3px}
.card .photo img{width:100%;height:114%;object-fit:cover;object-position:50% 0;transform:scale(1.1);transform-origin:50% 22%;pointer-events:none}
.card .gloss{position:absolute;inset:0;z-index:1;border-radius:10px;background:linear-gradient(115deg,rgba(255,255,255,.55),rgba(255,255,255,0) 35%,rgba(255,255,255,0) 70%,rgba(255,255,255,.25));pointer-events:none}
.card .note{position:absolute;top:12.5%;left:4%;transform:rotate(-6deg);font-size:15px;z-index:3}
.hero h1{position:relative;z-index:6;margin:6px 0 0;font:400 clamp(54px,8vw,96px)/1 var(--f-mark);letter-spacing:.02em;text-align:center}
.hero .sub{position:relative;z-index:6;margin:10px 0 0;font:400 clamp(16px,1.6vw,20px)/1.5 var(--f-body);color:var(--ink-soft);text-align:center;max-width:36em}
.hint{position:relative;z-index:6;margin-top:10px;font:400 15px/1 var(--f-hand);color:var(--ink-soft);display:flex;gap:8px;align-items:center}
#hint{display:none}
#worksLabel{display:none}
:lang(ar) .bigword{font-size:clamp(56px,15vw,250px);font-weight:800;top:22%;line-height:1.1}
.hint svg{width:34px;height:20px}
.hint svg path{fill:none;stroke:var(--ink-soft);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}

/* notes and doodles */
.note{display:inline-flex;align-items:center;gap:6px;background:var(--note);padding:5px 12px 6px 34px;font:400 17px/1.2 var(--f-hand);position:relative;
  box-shadow:2px 3px 0 rgba(0,0,0,.08)}
:lang(ar) .note{padding:5px 34px 6px 12px}
.note img{position:absolute;inset-inline-start:-6px;top:-16px;width:36px;height:32px;object-fit:contain}
.scribble{font:400 17px/1.3 var(--f-hand);color:var(--ink);display:inline-flex;align-items:center;gap:8px}
.scribble svg{width:46px;height:30px;flex:none}
.scribble svg path{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* works */
section{position:relative}
.sec-label{text-align:center;font:400 20px/1 var(--f-hand);margin:30px 0 18px}
.works{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:clamp(40px,7vw,90px);padding-block:10px 60px}
.row{display:grid;grid-template-columns:minmax(0,860px);justify-content:center;gap:clamp(24px,5vw,70px);align-items:start}
.row.pair{grid-template-columns:1fr 1fr;justify-content:stretch}
.row.pair.flip{grid-template-columns:.85fr 1.15fr}
.work{position:relative;min-width:0}
.frame{position:relative;padding:5.5%;transform:rotate(var(--r,-1.2deg));transition:transform .5s cubic-bezier(.3,1.4,.5,1)}
.work:hover .frame{transform:rotate(calc(var(--r,-1.2deg) * -0.6)) scale(1.015)}
.frame::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(20,20,20,.13) 0 1.5px,transparent 1.5px 9px);
  -webkit-mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);padding:5.5%}
.frame svg.edge{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.frame svg.edge path{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.pic{position:relative;aspect-ratio:16/10;overflow:hidden;background:#ddd;box-shadow:inset 0 0 0 1.5px var(--ink)}
.pic .ph{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font:400 16px/1.3 var(--f-hand);color:rgba(20,20,20,.55)}
.pic a{position:absolute;inset:0}
.pic video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#e9e4d8}
.playbtn{position:absolute;inset-inline-end:12px;bottom:12px;z-index:2;display:inline-flex;align-items:center;gap:8px;border:2px solid var(--ink);background:var(--note);
  border-radius:999px;padding:7px 14px 7px 10px;font:400 16px/1 var(--f-hand);cursor:pointer;box-shadow:2px 2px 0 var(--ink);transform:rotate(-2deg)}
.playbtn svg{width:14px;height:14px}
.playbtn:hover{transform:rotate(-2deg) scale(1.05)}
.pic.has-video{cursor:pointer}
.posts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 2% 0}
.post{padding:0;border:1.5px solid var(--ink);background:#fff;cursor:zoom-in;aspect-ratio:4/5;overflow:hidden;transform:rotate(var(--pr,0deg));
  box-shadow:2px 2px 0 var(--ink);transition:transform .2s}
.post:hover,.post:focus-visible{transform:rotate(0deg) scale(1.06)}
.post img{display:block;width:100%;height:100%;object-fit:cover}
.viewer img{max-width:min(720px,100%);max-height:calc(100svh - 110px);border:3px solid #fff;box-shadow:0 30px 60px rgba(0,0,0,.5)}
/* full-screen viewer for the campaign film */
.viewer{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(20,20,20,.86);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.viewer video{width:min(1200px,100%);max-height:calc(100svh - 110px);aspect-ratio:16/9;background:#000;border:3px solid #fff;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.viewer .close{position:absolute;top:max(16px,env(safe-area-inset-top,0px));inset-inline-end:max(16px,env(safe-area-inset-right,0px));border:2px solid #fff;background:none;color:#fff;
  font:400 18px/1 var(--f-hand);border-radius:999px;padding:8px 16px;cursor:pointer}
.meta{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:12px;padding-inline:2%}
.meta h3{margin:0;font:400 21px/1.1 var(--f-body);font-weight:700;border-bottom:1.5px solid var(--ink);padding-bottom:3px}
.tag{position:relative;padding:4px 14px;font:400 15px/1 var(--f-hand);white-space:nowrap}
.tag svg{position:absolute;inset:-4px -6px;width:calc(100% + 12px);height:calc(100% + 8px);overflow:visible}
.tag{padding:5px 16px}
.tag svg path{fill:none;stroke:#6f6f6f;stroke-width:1.1;stroke-linecap:round;vector-effect:non-scaling-stroke}
.desc{margin:10px 2% 0;font:300 16px/1.6 var(--f-body);color:var(--ink-soft);max-width:34em}
.work .note{position:absolute;top:-14px;inset-inline-start:-10px;z-index:3;transform:rotate(-4deg)}
.work .scribble{margin:18px 0 0 8%}
.visit{display:inline-block;margin:12px 2% 0;font:400 16px/1 var(--f-mark);color:var(--ink);text-decoration:none;border-bottom:2px solid var(--note)}

/* camera: its own screen-sized stage */
.cam-sec{min-height:calc(100svh - 70px);box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,2.4vh,26px);padding-block:30px;overflow:visible}
.cam-sec h2{margin:0;text-align:center;font:400 clamp(32px,4vw,56px)/1.02 var(--f-mark);letter-spacing:.01em}
.cam-sec h2 s{text-decoration:none;position:relative}
.cam-sec h2 s::after{content:"";position:absolute;left:-4%;right:-4%;top:52%;height:5px;border-radius:3px;background:var(--ink);transform:rotate(-3deg);opacity:0;transition:opacity .3s}
.cam-sec .note{transform:rotate(-3deg)}
.cam-stage{position:relative;width:min(1000px,100%,calc((100svh - 390px) * 1.6));display:flex;justify-content:center}
section[id],main[id]{scroll-margin-top:84px}
.slide .ph{position:absolute;inset:0}
.prints{position:absolute;top:21%;bottom:15%;left:0;right:0;pointer-events:none;z-index:0}
.print{position:absolute;top:0;left:0;height:100%;aspect-ratio:4/3.3;background:#fff;padding:1.4%;box-sizing:border-box;border:2px solid var(--ink);box-shadow:0 10px 22px -10px rgba(0,0,0,.35);
  transform:translateX(-30%);transition:transform .9s cubic-bezier(.2,.9,.25,1)}
.print img,.print .ph{width:100%;height:100%;object-fit:cover;display:block;position:relative}
.print .ph{overflow:hidden}
.camera{position:relative;z-index:2;width:min(1000px,100%);aspect-ratio:1.6;border-radius:clamp(20px,3.4vw,40px);padding:4.5% 4.2%;box-sizing:border-box;
  display:grid;grid-template-columns:1fr 25%;gap:5%;align-items:center;
  background-color:#CBC5BA;
  background-image:linear-gradient(rgba(255,255,255,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.18) 1px,transparent 1px),linear-gradient(180deg,#d8d3c9,#c4beb2);
  background-size:9px 9px,9px 9px,100% 100%;
  box-shadow:0 40px 60px -30px rgba(0,0,0,.45),inset 0 0 0 1.5px rgba(0,0,0,.18),inset 0 3px 0 rgba(255,255,255,.55),inset 0 -6px 10px rgba(0,0,0,.12)}
.screen{position:relative;aspect-ratio:4/3;border-radius:clamp(10px,1.8vw,22px);background:#0b0b0b;padding:2.4%;box-sizing:border-box;box-shadow:inset 0 0 0 3px #262626,0 2px 0 rgba(255,255,255,.4)}
.screen .view{position:relative;width:100%;height:100%;overflow:hidden;border-radius:clamp(6px,1vw,12px);background:#1d1d1d}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .35s, transform .45s;transform:scale(1.05)}
.slide.on{opacity:1;transform:none}
.slide img{width:100%;height:100%;object-fit:cover}
/* portrait shots: whole photo shown, with a soft blurred fill behind it */
.tallwrap{position:absolute;inset:0;overflow:hidden;background:#111}
.tallwrap .bg{position:absolute;inset:-10%;width:120%;height:120%;object-fit:cover;filter:blur(18px) brightness(.5)}
.tallwrap .fg{position:relative;width:100%;height:100%;object-fit:contain}
.slide .cap{position:absolute;inset:auto 0 0;padding:10% 4% 4%;font:400 clamp(13px,1.5vw,18px)/1.2 var(--f-hand);color:#fff;background:linear-gradient(0deg,rgba(0,0,0,.55),transparent)}
.hud{position:absolute;top:4%;inset-inline:3.2%;display:flex;justify-content:space-between;align-items:center;z-index:2;direction:ltr}
.hud .play{width:clamp(22px,3.4vw,36px);aspect-ratio:1;border-radius:5px;background:rgba(0,0,0,.6);display:grid;place-items:center}
.hud .play svg{width:46%;height:46%}
.hud .count{background:rgba(0,0,0,.6);color:#fff;border-radius:6px;padding:.35em .55em;font:600 clamp(11px,1.5vw,19px)/1 ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:.04em}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:3}
.flash.go{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.95}100%{opacity:0}}
.brand{position:absolute;inset-inline-start:4.2%;width:calc((100% - 8.4%) * .75 - 5% * .75);bottom:2.2%;text-align:center;font:700 clamp(11px,1.7vw,21px)/1 "Helvetica Neue",Arial,sans-serif;letter-spacing:.32em;color:#5f594f;direction:ltr;
  text-shadow:0 1px 0 rgba(255,255,255,.5)}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:clamp(14px,3vw,34px)}
.dpad{position:relative;width:100%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 50% 30%,#8a8782,#5d5a55 60%,#4d4a46);box-shadow:inset 0 3px 4px rgba(255,255,255,.25),inset 0 -4px 6px rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.35)}
.dpad button{position:absolute;border:0;background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.dpad .l,.dpad .r{top:34%;width:24%;height:32%}
.dpad .l{left:3%}.dpad .r{right:3%}
.dpad .l svg,.dpad .r svg{width:46%;height:46%}
.dpad .l svg path,.dpad .r svg path{fill:#d8d6d2}
.dpad .ok{left:30%;top:30%;width:40%;height:40%;border-radius:50%;
  background:radial-gradient(circle at 50% 35%,#7d7a75,#57544f);color:#f3f2ef;font:800 clamp(12px,1.9vw,24px)/1 "Helvetica Neue",Arial,sans-serif;
  box-shadow:0 4px 8px rgba(0,0,0,.45),inset 0 2px 2px rgba(255,255,255,.25)}
.dpad button:active{transform:scale(.93)}
.dpad .l:active,.dpad .r:active{transform:scale(.88)}
.green{width:34%;aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;
  background:radial-gradient(circle at 45% 35%,#78d374,#3c9a39 65%,#2f7f2d);box-shadow:0 5px 10px rgba(0,0,0,.35),inset 0 2px 2px rgba(255,255,255,.35)}
.green svg{width:38%;height:38%}
.green:active{transform:scale(.93)}
.cam-sec .scribble{margin-top:4px}
@media (max-width:760px){
  .camera{grid-template-columns:1fr 27%;padding:5% 4.5%}
  .prints{display:none}
  .cam-sec{min-height:auto;padding-block:50px}
}

/* every doodle wobbles like a hand-drawn loop */
.boil{animation:boil .9s steps(1) infinite}
@keyframes boil{0%{transform:rotate(-2deg) translate(0,0)}25%{transform:rotate(1.5deg) translate(.5px,-.5px)}50%{transform:rotate(-1deg) translate(-.5px,.5px)}75%{transform:rotate(2deg) translate(0,-.5px)}}
.note img.boil,.logo img.boil{transform-origin:50% 60%}

/* notebook: the section pins the book on screen; scrolling turns the cover */
.contact-sec{height:260svh;position:relative}
.pin{position:sticky;top:70px;height:calc(100svh - 70px);display:flex;align-items:center;justify-content:center}
.book{position:relative;width:min(640px,100%);margin:0 auto;min-height:min(560px,calc(100svh - 130px));display:flex;perspective:2000px;perspective-origin:0 50%;will-change:transform}
:lang(ar) .book{perspective-origin:100% 50%}
.page{position:relative;flex:1;background:#f7f7f6;border-radius:6px 14px 14px 6px;box-shadow:0 24px 40px -24px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.06);padding:44px 34px 30px 54px;display:flex;flex-direction:column;gap:22px}
:lang(ar) .page{border-radius:14px 6px 6px 14px;padding:44px 54px 30px 34px}
.rings{position:absolute;top:30px;bottom:30px;inset-inline-start:-11px;width:24px;display:flex;flex-direction:column;justify-content:space-between;z-index:6}
.rings i{display:block;height:12px;border-radius:6px;background:linear-gradient(90deg,#3a3a3a,#9a9a9a 45%,#3a3a3a);box-shadow:0 1px 1px rgba(0,0,0,.4)}
.cover{position:absolute;inset:0;transform-origin:0 50%;transform-style:preserve-3d;z-index:5;will-change:transform}
:lang(ar) .cover{transform-origin:100% 50%}
.cover .shade{position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:#000;opacity:0;z-index:2}
.cover .side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--note);border-radius:6px 14px 14px 6px;display:grid;place-items:center;overflow:hidden;
  box-shadow:0 24px 40px -24px rgba(0,0,0,.35),inset 0 0 0 1px rgba(0,0,0,.08)}
.cover .back{transform:rotateY(180deg);border-radius:14px 6px 6px 14px;flex-direction:column}
.cover .front h2{position:relative;margin:0;font:400 clamp(30px,4.2vw,54px)/1.02 var(--f-mark);text-align:center;text-transform:uppercase;transform:rotate(-2deg)}
.cover .front svg{position:absolute;width:88%;height:52%;left:6%;top:24%;overflow:visible}
.cover .front svg path{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round;vector-effect:non-scaling-stroke}
.cover .back .doodle{display:flex;flex-direction:column;align-items:center;gap:8px;transform:rotate(-4deg)}
.cover .back img{width:min(320px,70%);height:auto}
.cover .back span{font:400 20px/1 var(--f-hand)}
.page h3{margin:0 0 6px;align-self:flex-start;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20200%2040%27%20preserveAspectRatio%3D%27none%27%3E%3Cpath%20fill%3D%27%23141414%27%20d%3D%27M6%2012C10%204%2040%206%2070%205C110%203%20160%202%20190%206C198%209%20197%2024%20193%2031C185%2038%20140%2036%20100%2037C60%2038%2022%2039%209%2034C2%2030%203%2018%206%2012Z%27/%3E%3C/svg%3E") center/100% 100% no-repeat;color:#fff;font:400 17px/1 var(--f-mark);padding:7px 18px 8px;transform:rotate(-2deg)}

.field label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.field input,.field textarea{border:0;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20400%206%27%20preserveAspectRatio%3D%27none%27%3E%3Cpath%20d%3D%27M1%203.6C60%202.2%20120%204.4%20200%203.2S330%202.4%20399%203.9%27%20fill%3D%27none%27%20stroke%3D%27%233a3a3a%27%20stroke-width%3D%271.3%27%20vector-effect%3D%27non-scaling-stroke%27%20stroke-linecap%3D%27round%27/%3E%3C/svg%3E") left bottom/100% 6px no-repeat;font:400 clamp(20px,2.2vw,26px)/1.4 var(--f-hand);padding:14px 16px 16px;resize:vertical;outline:none;color:var(--ink)}

.field input:focus,.field textarea:focus{background-color:rgba(255,230,0,.12)}
.field textarea{min-height:90px}
.send{align-self:flex-end;position:relative;border:0;background:none;cursor:pointer;width:150px;height:60px;padding:0;margin-top:6px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;font:400 21px/1 var(--f-hand);color:var(--ink);isolation:isolate}
.send .sendart{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:0;transition:transform .25s}
.send .hatch{display:none}
.send .loop2{fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
.send > span{position:relative;z-index:2;transform:rotate(-3deg)}

:lang(ar) .send .arw{transform:scaleX(-1) rotate(-3deg)}
.send:hover .sendart{transform:rotate(-3deg) scale(1.05)}
.send:disabled{opacity:.6;cursor:wait}
.sent{font:400 17px/1.3 var(--f-hand);color:var(--ink-soft)}
.links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid rgba(20,20,20,.09);padding-top:16px;margin-top:auto;font:400 17px/1.2 var(--f-hand)}

/* reveal: elements start visible; only a gentle settle */
.reveal{transition:transform .8s cubic-bezier(.2,.9,.3,1.2)}
.reveal.pre{transform:translateY(24px) rotate(1deg)}

  .row.pair,.row.pair.flip{grid-template-columns:1fr}
  .hero{margin-top:-104px;min-height:auto}

  .page{padding:40px 22px 26px 40px}

  .book{min-height:0}
  .camera{grid-template-columns:1fr 28%}
}

/* hand-drawn helpers: wobbly paths seeded so they stay put */
function rnd(seed){ let s = seed % 2147483647; if(s<=0) s += 2147483646; return () => (s = s * 16807 % 2147483647) / 2147483647; }
function ellipseD(seed){ const r = rnd(seed); const pts = []; for(let i=0;i<=25;i++){ const a = i/24*Math.PI*2 - .3; const j = 1 + (r()-.5)*.08;
  pts.push([50 + Math.cos(a)*48*j, 50 + Math.sin(a)*44*j]); }
  return "M" + pts.map(p=>p.map(v=>v.toFixed(1)).join(" ")).join(" L"); }
function edgeD(seed){ const r = rnd(seed); const j = () => (r()-.5)*1.4;
  const o = [[0+j(),0+j()],[100+j(),0+j()],[100+j(),100+j()],[0+j(),100+j()]];
  const i = [[5.5,8.26],[94.5,8.26],[94.5,91.74],[5.5,91.74]]; /* exactly the picture edge: .pic is 16/10 inside 5.5% padding, so the frame is 1.5:1 */
  const box = q => `M${q[0]} L${q[1]} L${q[2]} L${q[3]} Z`.replace(/,/g," ");
  const ties = o.map((p,k)=>`M${p.join(" ")} L${i[k].join(" ")}`).join(" ");
  return `${box(o)} ${box(i)} ${ties}`; }
/* arrows: a loose curve plus a two-stroke head, jittered per seed */
function arrowD(seed){ const r = rnd(seed); const j = () => (r()-.5)*2.2;
  return `M${44+j()} ${22+j()}C${30+j()} ${26+j()} ${16+j()} ${22+j()} 6 8M6 8l${1+j()*.4} ${10+j()*.4}M6 8l${9+j()*.4} ${2+j()*.4}`; }
const GEN = {e:ellipseD, f:edgeD, a:arrowD};
function ellipse(seed){ return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" data-gen="e" data-seed="${seed}" d="${ellipseD(seed)}"/></svg>`; }
function edge(seed){ return `<svg class="edge" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path data-gen="f" data-seed="${seed}" d="${edgeD(seed)}"/></svg>`; }
let arrowSeed = 700;
/* tag outline: a rounded pill gone over twice with a pencil, the two passes never quite matching */
function pencilPill(seed){ const r = rnd(seed); const j = (a=3.2) => ((r()-.5)*a).toFixed(1);
  const pass = () => `M${12+ +j()} ${4+ +j()}H${88+ +j()}C${99+ +j()} ${4+ +j()} ${99+ +j()} ${36+ +j()} ${88+ +j()} ${36+ +j()}H${12+ +j()}C${1+ +j()} ${36+ +j()} ${1+ +j()} ${4+ +j()} ${14+ +j()} ${3+ +j()}`;
  return `<svg viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true"><path d="${pass()}"/><path d="${pass()}"/></svg>`; }
/* nav ovals: one loose stroke that starts top-right, loops round and runs a little past where it began */
const OVALS = [
  "M62 6C40 3 14 6 5 15C-2 23 6 34 28 37C52 40 84 37 95 28C103 20 96 8 76 4C64 1 50 0 40 1",
  "M58 7C36 4 11 8 4 17C-2 25 8 35 30 37C55 39 86 35 96 26C103 18 94 6 72 3C60 1 47 -1 36 0",
  "M65 6C42 3 15 5 6 14C-1 22 5 33 27 37C51 41 83 38 94 29C102 21 97 9 78 4C66 1 53 0 43 1"];
const arrow = (flip) => { const sd = arrowSeed++; return `<svg class="arrow" viewBox="0 0 46 30" aria-hidden="true" style="${flip?"transform:scaleX(-1)":""}"><path pathLength="1" data-gen="a" data-seed="${sd}" d="${arrowD(sd)}"/></svg>`; };

/* ---------- sound (synthesised, starts after a click) ---------- */
let ac = null;
function audio(){ try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended") ac.resume(); }catch(_){ ac = null; } return ac; }
function click(freq=1800, len=.03, vol=.15){
  const a = audio(); if(!a) return;
  const b = a.createBuffer(1, a.sampleRate*len, a.sampleRate), d = b.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/d.length, 3);
  const s = a.createBufferSource(); s.buffer = b;
  const f = a.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 1.2;
  const g = a.createGain(); g.gain.value = vol; s.connect(f).connect(g).connect(a.destination); s.start();
}
function shutter(){ click(2400,.04,.25); setTimeout(()=>click(900,.07,.2),70); }

/* ---------- hanging badge physics ---------- */
const lanyard = $("lanyard"), swing = $("swing"), strapEl = $("strap"), claspEl = $("clasp"), cardEl = $("card");
let theta = .55, omega = 0, drag = null, len = 300, cw = 260, lastT = 0;
function sizeBadge(){
  const h = lanyard.clientHeight, w = lanyard.clientWidth;
  cw = Math.min(300, w*0.62, h*0.5); len = Math.max(60, h - cw*616/476 - 160);
  swing.style.setProperty("--cw", cw+"px");
  strapEl.style.height = (len + 40 + 6) + "px";
  claspEl.style.top = len + "px";
  cardEl.style.top = (len + 139 - 22) + "px";
}
function tick(t){
  const dt = Math.min(.033, (t - (lastT||t))/1000); lastT = t;
  if(!drag){ omega += (-9.8 / (len/90) * Math.sin(theta)) * dt; omega *= Math.pow(.35, dt); theta += omega * dt; }
  swing.style.transform = `rotate(${theta}rad)`;
  cardEl.style.transform = `rotate(${(-omega*0.04).toFixed(4)}rad)`;
  requestAnimationFrame(tick);
}
function anchor(){ const r = lanyard.getBoundingClientRect(); return {x:r.left + r.width/2, y:r.top}; }
/* a passing cursor nudges the badge; dragging still works */
let hov = null;
lanyard.addEventListener("pointermove", e => {
  if(drag || e.pointerType === "touch") { hov = null; return; }
  const r = cardEl.getBoundingClientRect();
  const inside = e.clientX > r.left - 12 && e.clientX < r.right + 12 && e.clientY > r.top - 12 && e.clientY < r.bottom + 12;
  const now = performance.now();
  if(inside && hov){
    const dt = Math.max(8, now - hov.t), vx = (e.clientX - hov.x) / dt;  /* px per ms */
    omega += Math.max(-0.12, Math.min(0.12, -vx * 0.08));
    omega = Math.max(-0.9, Math.min(0.9, omega));
  }
  hov = inside ? {x:e.clientX, t:now, s: hov ? hov.s : 0} : null;
});
lanyard.addEventListener("pointerleave", () => { hov = null; });
cardEl.addEventListener("pointerdown", e => {
  const a = anchor(); drag = {last: Math.atan2(e.clientX - a.x, e.clientY - a.y), t: performance.now()};
  cardEl.setPointerCapture(e.pointerId); click(700,.05,.12);
});
cardEl.addEventListener("pointermove", e => {
  if(!drag) return; const a = anchor();
  const ang = Math.max(-1.2, Math.min(1.2, -Math.atan2(e.clientX - a.x, e.clientY - a.y)));
  const now = performance.now(), dt = Math.max(8, now - drag.t)/1000;
  omega = (ang - theta) / dt; theta = ang; drag.t = now;
});
const endDrag = () => { if(drag){ drag = null; omega = Math.max(-6, Math.min(6, omega)); } };
cardEl.addEventListener("pointerup", endDrag); cardEl.addEventListener("pointercancel", endDrag);

let shot = 0, busy = false, showPrints = true;
const shotHTML = s => s.img ? (s.tall ? `<div class="tallwrap"><img class="bg" src="${s.img}" alt=""><img class="fg" src="${s.img}" alt=""></div>` : `<img src="${s.img}" alt="">`) : `<div class="ph">${placeholder(s.hue,"")}</div>`;

/* geometry: slot 0 sits just outside the camera edge, later slots further out; "in" is tucked behind the camera */
function geo(){
  const rtl = T[lang].dir === "rtl", cam = $("cam"), box = $("prints");
  const cw = cam.offsetWidth, ph = box.offsetHeight, pw = ph * 4 / 3.3, sw = box.offsetWidth;
  const camL = (sw - cw) / 2;
  const slot = k => rtl ? camL - pw * (1.02 + k * 1.1) : camL + cw - pw * 0.02 + k * pw * 1.1;
  const tuck = rtl ? camL + cw * 0.35 : camL + cw * 0.65 - pw;
  return {slot, tuck, pw};
}
const queue = () => [1,2,3].map(k => (shot + k) % SH.length);
function place(el, x, k, animate){
  if(!animate){ el.style.transition = "none"; }
  el.style.transform = `translateX(${x}px) rotate(${(k%2?1:-1)*1.1}deg)`;
  if(!animate){ void el.offsetWidth; el.style.transition = ""; }
}
function layPrints(){
  const box = $("prints"); box.style.display = showPrints ? "" : "none";
  const q = queue(), g = geo();
  box.innerHTML = q.map(i => `<div class="print" data-i="${i}">${shotHTML(SH[i])}</div>`).join("");
  [...box.children].forEach((el,k) => { el.style.zIndex = 20 - k; place(el, g.slot(k), k, false); });
}
function step(dir){
  if(busy) return; busy = true; click(1600,.025,.12);
  const box = $("prints"), g = geo(), els = [...box.children];
  if(dir > 0){
    /* the nearest photo slides behind the camera, the rest shuffle closer, a new one arrives at the end */
    place(els[0], g.tuck, 0, true);
    els.slice(1).forEach((el,k) => place(el, g.slot(k), k, true));
    const nxt = (shot + 4) % SH.length, el = document.createElement("div");
    el.className = "print"; el.innerHTML = shotHTML(SH[nxt]); el.style.zIndex = 17; box.appendChild(el);
    place(el, g.slot(3), 2, false); requestAnimationFrame(()=>place(el, g.slot(2), 2, true));
    setTimeout(()=>{ shot = (shot + 1) % SH.length; setScreen(); click(320,.18,.06); }, 420);
  } else {
    /* the photo on screen comes back out from behind the camera to the front of the line */
    const prev = (shot - 1 + SH.length) % SH.length, el = document.createElement("div");
    el.className = "print"; el.innerHTML = shotHTML(SH[shot]); el.style.zIndex = 21; box.insertBefore(el, box.firstChild);
    place(el, g.tuck, 0, false);
    shot = prev; setScreen();
    requestAnimationFrame(()=>{ place(el, g.slot(0), 0, true); els.forEach((e,k) => place(e, g.slot(k+1), k+1, true)); });
    click(320,.18,.06);
  }
  setTimeout(()=>{ layPrints(); busy = false; }, 950);
}

};

/* ---------- notebook cover turns with the scroll while the book is pinned ---------- */
const cover = $("cover"), book = $("book"), csec = $("contact");
function coverStep(){

  const run = csec.offsetHeight - pinH;
  const raw = Math.max(0, Math.min(1, (70 - r.top) / run));
  const p = Math.max(0, Math.min(1, (raw - 0.12) / 0.7));          /* holds closed, then opens, then rests open */
  const e = p < .5 ? 2*p*p : 1 - Math.pow(-2*p + 2, 2)/2;
  const rtl = T[lang].dir === "rtl", ang = 180 * e * (rtl ? 1 : -1);
  cover.style.transform = `rotateY(${ang}deg)`;
  const room = innerWidth >= book.offsetWidth * 2 + 60;   /* centre the open spread when it fits */
  book.style.transform = room ? `translateX(${(rtl ? -50 : 50) * e}%)` : "none";
  cover.style.pointerEvents = e > .5 ? "none" : "auto";
  $("shadeF").style.opacity = (Math.min(1, e*2) * .28).toFixed(3);
  $("shadeB").style.opacity = (Math.max(0, 1 - e) * .5 * (e > .5 ? 1 : 0)).toFixed(3);
}
addEventListener("scroll", () => requestAnimationFrame(coverStep), {passive:true});

/* ---------- campaign posts: open full size on click ---------- */
document.addEventListener("click", e => {
  const b = e.target.closest(".post"); if(!b) return;
  const v = document.createElement("div"); v.className = "viewer"; v.setAttribute("role","dialog"); v.setAttribute("aria-modal","true");
  v.innerHTML = `<button class="close" type="button">${T[lang].close}</button><img src="${b.dataset.full}" alt="${b.dataset.alt}">`;
  document.body.appendChild(v);
  const shut = () => { v.remove(); removeEventListener("keydown", esc); b.focus(); };
  const esc = ev => { if(ev.key === "Escape") shut(); };
  v.querySelector(".close").onclick = shut;
  v.addEventListener("click", ev => { if(ev.target === v) shut(); });
  addEventListener("keydown", esc);
  v.querySelector(".close").focus();
});

/* ---------- campaign film: plays muted in its frame, opens with sound on click ---------- */
document.addEventListener("click", e => {
  const pic = e.target.closest(".pic.has-video"); if(!pic) return;
  const src = pic.dataset.video, inline = pic.querySelector("video");
  const v = document.createElement("div"); v.className = "viewer"; v.setAttribute("role","dialog"); v.setAttribute("aria-modal","true");
  v.innerHTML = `<button class="close" type="button">${T[lang].close}</button><video src="${src}" controls playsinline></video>`;
  document.body.appendChild(v);
  const vid = v.querySelector("video");
  try{ vid.currentTime = 0; }catch(_){}
  vid.volume = 0.15;
  if(inline) inline.pause();
  vid.play().catch(()=>{});
  const shut = () => { vid.pause(); v.remove(); if(inline) inline.play().catch(()=>{}); removeEventListener("keydown", esc); };
  const esc = ev => { if(ev.key === "Escape") shut(); };
  v.querySelector(".close").onclick = shut;
  v.addEventListener("click", ev => { if(ev.target === v) shut(); });
  addEventListener("keydown", esc);
  v.querySelector(".close").focus();
});

/* ---------- form + copy ---------- */
/* messages go to Hessah's inbox through Web3Forms (public access key, safe to ship in page code) */
const W3F_KEY = "9b85a7a6-d450-4cc1-b015-ce2a6b7447d4";
$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const t = T[lang], out = $("sent"), btn = $("send");
  const name = $("fName").value.trim(), email = $("fMail").value.trim(), message = $("fMsg").value.trim();
  out.hidden = false;
  if(!name || !message || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ out.textContent = t.missing; return; }
  btn.disabled = true; out.textContent = t.sending;
  try{
    const res = await fetch("https://api.web3forms.com/submit", {method:"POST", headers:{"Content-Type":"application/json", Accept:"application/json"},
      body: JSON.stringify({access_key:W3F_KEY, subject:"New message from your portfolio", from_name:"Hessah portfolio", name, email, message})});
    const data = await res.json().catch(() => ({}));
    if(!res.ok || data.success === false) throw new Error("rejected");
    out.textContent = t.sent; $("form").reset(); click(1200,.05,.15);
  }catch(_){ out.textContent = t.fail; }
  btn.disabled = false;
});
$("mailBtn").onclick = () => {
  const b = $("mailBtn"), txt = b.textContent;
  try{ navigator.clipboard.writeText(txt).then(()=>{ b.textContent = T[lang].copied; setTimeout(()=>b.textContent = txt, 1300); }, ()=>{}); }catch(_){}
};


/* ---------- gentle settle on cards as they arrive ---------- */
let io;
function observe(){
  if(io) io.disconnect();
  if(matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) return;
  io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.remove("pre"); io.unobserve(e.target); } }), {rootMargin:"0px 0px -10% 0px"});
  document.querySelectorAll(".reveal").forEach(el => { if(el.getBoundingClientRect().top > innerHeight){ el.classList.add("pre"); io.observe(el); } });
}
